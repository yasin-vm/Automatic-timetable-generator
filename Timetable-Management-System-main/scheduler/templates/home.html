
<!DOCTYPE html>
<html>
<head>
    <title>Timetable Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2ff;
            text-align: center;
            padding: 70px 20px;
        }

        h1 {
            color: #243b64;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            margin-top: 50px;
        }

        .card {
            background: white;
            width: 230px;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 5px 18px #0002;
        }

        .card a {
            display: inline-block;
            background: #315b91;
            color: white;
            padding: 12px 25px;
            border-radius: 7px;
            text-decoration: none;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h1>Timetable Management System</h1>
    <p>Welcome! Select your login portal.</p>

    <div class="container">

        <div class="card">
            <h2>HOD</h2>
            <p>Manage teachers, subjects and timetables.</p>
            <a href="/hod-login/">Login</a>
        </div>

        <div class="card">
            <h2>Teacher</h2>
            <p>View your teaching schedule.</p>
            <a href="/teacher-login/">Login</a>
        </div>

        <div class="card">
            <h2>Student</h2>
            <p>View your class timetable.</p>
            <a href="/student-login/">Login</a>
        </div>

    </div>

</body>
</html>
