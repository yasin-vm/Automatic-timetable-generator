
<!DOCTYPE html>
<html>
<head>
    <title>Delete Allocation</title>
</head>
<body>

<h2>Delete Allocation</h2>

<p>
    Are you sure you want to delete this allocation?
</p>

<p>
    Teacher: {{ allocation.teacher.teacher_name }}
</p>

<p>
    Subject: {{ allocation.subject.subject_name }}
</p>

<form method="POST">
    {% csrf_token %}

    <button type="submit">
        Yes, Delete
    </button>
</form>

<a href="{% url 'allocation_list' %}">
    Cancel
</a>

</body>
</html>
